
server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/interview_scheduler
    username: scheduler_user
    password:  ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
jwt:
  secret:  ${JWT_SECRET}
  expiration-ms: 3600000

app:
    registration:
      interviewer-invite-code: ${INTERVIEWER_INVITE_CODE:}